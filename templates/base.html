<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>{% block title %}Presidentex — cuatro años al mando de Haití{% endblock %}</title>
<meta name="description" content="Simulación política en Python: gobernás Haití durante cuatro años y tus decisiones deciden si termina en reelección, huida o colapso." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <div class="masthead">
    <div>
      <h1>Presidentex</h1>
      <div class="place">
        {% if nombre %}Presidente/a {{ nombre }}, República de Haití{% else %}Oficina de la Presidencia, República de Haití{% endif %}
      </div>
    </div>
    <svg class="seal" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="29" stroke="#c3a054" stroke-width="1.6"/>
      <circle cx="32" cy="32" r="23" stroke="#c3a054" stroke-width="1"/>
      <path d="M32 14 L36.5 27 L50 27 L39 35 L43 48 L32 40 L21 48 L25 35 L14 27 L27.5 27 Z"
        fill="none" stroke="#eee6d3" stroke-width="1.3"/>
    </svg>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
